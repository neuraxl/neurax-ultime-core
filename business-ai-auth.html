<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNX2 Business AI — Connexion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#05070d] text-white flex items-center justify-center p-6"><main class="w-full max-w-md bg-white/5 border border-cyan-400/20 rounded-3xl p-7"><div class="text-xs tracking-[.35em] text-cyan-300">LÉVIATHAN // UNX2</div><h1 class="text-3xl font-black mt-2">Business AI</h1><p class="text-slate-400 text-sm mt-2">Connexion sécurisée au centre d'affaires.</p><form id="auth" class="space-y-3 mt-6"><input id="email" type="email" required placeholder="Courriel" class="w-full bg-black/30 border border-slate-700 rounded-xl p-3"><input id="password" type="password" required minlength="8" placeholder="Mot de passe" class="w-full bg-black/30 border border-slate-700 rounded-xl p-3"><button class="w-full bg-cyan-400 text-black font-bold rounded-xl p-3">SE CONNECTER</button></form><div class="grid grid-cols-2 gap-3 mt-3"><button id="signup" class="border border-slate-700 rounded-xl p-3 text-sm">Créer un compte</button><button id="magic" class="border border-slate-700 rounded-xl p-3 text-sm">Lien magique</button></div><p id="msg" class="text-sm text-slate-400 mt-4"></p></main><script>(async()=>{const cfg=await fetch('/api/public-config').then(r=>r.json());const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),email=document.querySelector('#email'),password=document.querySelector('#password'),msg=document.querySelector('#msg');auth.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'Connexion réussie…';if(!error)location.href='/business-dashboard.html'};signup.onclick=async()=>{const {error}=await sb.auth.signUp({email:email.value,password:password.value});msg.textContent=error?error.message:'Compte créé.'};magic.onclick=async()=>{const {error}=await sb.auth.signInWithOtp({email:email.value,options:{emailRedirectTo:location.origin+'/business-dashboard.html'}});msg.textContent=error?error.message:'Lien magique envoyé.'}})();</script></body></html>
