name: UNX2 Registry Checks

on:
  push:
    branches: ["feat/unx2-open-source-registry"]
  pull_request:
    branches: ["main"]

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Compile API modules
        run: python -m compileall -q api/app
      - name: Import FastAPI application
        working-directory: api
        run: python -c "from app.main import app; print(app.title)"
