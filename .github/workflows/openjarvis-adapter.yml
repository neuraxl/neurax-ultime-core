name: OpenJarvis adapter tests

on:
  pull_request:
    paths:
      - "api/app/unx2_assistants/**"
      - "api/tests/test_openjarvis_adapter.py"
      - ".github/workflows/openjarvis-adapter.yml"
  push:
    branches: [main]
    paths:
      - "api/app/unx2_assistants/**"
      - "api/tests/test_openjarvis_adapter.py"
      - ".github/workflows/openjarvis-adapter.yml"

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run adapter isolation tests
        working-directory: api
        run: python -m pytest -q tests/test_openjarvis_adapter.py
