name: UNX2 API CI

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/unx2-api-ci.yml"
  push:
    branches:
      - main
      - "feat/unx2-three-intelligence-core-v0.3"

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      UNX2_API_KEY: ""
      DATABASE_URL: "postgresql+psycopg://unx2:test-only@localhost:5432/unx2"
      REDIS_URL: "redis://localhost:6379/0"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
