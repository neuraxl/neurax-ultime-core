name: Node.js CI

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "server/**"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "server/**"
      - ".github/workflows/node.js.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm install --ignore-scripts
      - run: npm run build --if-present
      - run: npm test --if-present
