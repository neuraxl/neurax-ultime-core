<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNX2 Business AI — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#05070d] text-white"><header class="border-b border-cyan-400/10 p-5"><div class="text-xs tracking-[.3em] text-cyan-300">LÉVIATHAN // UNX2</div><h1 class="text-2xl font-black">Business AI — Admin</h1></header><main class="max-w-7xl mx-auto p-5 grid md:grid-cols-3 gap-5"><div class="bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><div class="text-xs text-slate-500">LEADS</div><div id="leadCount" class="text-4xl font-black mt-2">…</div></div><div class="bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><div class="text-xs text-slate-500">DIAGNOSTICS</div><div id="diagCount" class="text-4xl font-black mt-2">…</div></div><div class="bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><div class="text-xs text-slate-500">PAIEMENTS</div><div id="payCount" class="text-4xl font-black mt-2">…</div></div><section class="md:col-span-3 bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><h2 class="font-bold">Pipeline leads</h2><div id="leads" class="mt-4 overflow-auto"></div></section></main><script>(async()=>{const cfg=await fetch('/api/public-config').then(r=>r.json());const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/business-ai-auth.html';return}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(!p||!['admin','manager'].includes(p.role)){document.body.innerHTML='<div class="p-10 text-red-300">Accès administrateur requis.</div>';return}const [l,d,pay]=await Promise.all([sb.from('leads').select('*').order('created_at',{ascending:false}),sb.from('business_diagnostics').select('id'),sb.from('payments').select('*').order('created_at',{ascending:false})]);leadCount.textContent=l.data?.length||0;diagCount.textContent=d.data?.length||0;payCount.textContent=pay.data?.length||0;leads.innerHTML=(l.data||[]).map(x=>'<div class="grid grid-cols-5 gap-3 border-b border-slate-800 py-3 text-sm"><span>'+x.company+'</span><span>'+x.email+'</span><span>'+x.status+'</span><span>'+x.source+'</span><span>'+new Date(x.created_at).toLocaleDateString('fr-CA')+'</span></div>').join('')||'<div class="text-slate-500">Aucun lead.</div>'})();</script></body></html>
