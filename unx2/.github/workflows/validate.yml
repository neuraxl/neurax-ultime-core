name: UNX2 validation
on:
  push:
    paths: ["unx2/**"]
  pull_request:
    paths: ["unx2/**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unx2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/validate.mjs
