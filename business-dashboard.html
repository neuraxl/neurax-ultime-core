<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNX2 Business AI — Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#05070d] text-white"><header class="border-b border-cyan-400/10 p-5 flex justify-between"><div><span class="text-xs tracking-[.3em] text-cyan-300">UNX2 BUSINESS AI</span><h1 class="text-2xl font-black">Centre de contrôle</h1></div><button id="logout" class="text-sm border border-slate-700 rounded-xl px-4">Déconnexion</button></header><main class="max-w-6xl mx-auto p-5 grid lg:grid-cols-3 gap-5"><section class="lg:col-span-2 bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><div class="flex justify-between"><h2 class="font-bold">Mes diagnostics</h2><a href="/business-ai.html" class="text-cyan-300 text-sm">+ Nouveau</a></div><div id="diagnostics" class="mt-5 space-y-3"></div></section><section class="bg-white/5 border border-cyan-400/10 rounded-2xl p-5"><h2 class="font-bold">Compte</h2><div id="profile" class="text-sm text-slate-400 mt-4"></div><div class="mt-6"><div class="text-xs text-slate-500">STATUT</div><div id="role" class="text-cyan-300 mt-1">…</div></div><a id="admin" href="/business-admin.html" class="hidden mt-6 block border border-cyan-400/30 rounded-xl p-3 text-center text-cyan-300">ADMIN CENTER</a></section></main><script>(async()=>{const cfg=await fetch('/api/public-config').then(r=>r.json());const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/business-ai-auth.html';return}profile.textContent=session.user.email;logout.onclick=()=>sb.auth.signOut().then(()=>location.href='/business-ai-auth.html');const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();role.textContent=p?.role||'client';if(p?.role==='admin'||p?.role==='manager')admin.classList.remove('hidden');const {data:d,error}=await sb.from('business_diagnostics').select('id,company,sector,problem,created_at').order('created_at',{ascending:false});diagnostics.innerHTML=error?'<div class="text-red-300">'+error.message+'</div>':(d||[]).map(x=>'<article class="border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-500">'+new Date(x.created_at).toLocaleString('fr-CA')+'</div><div class="font-bold mt-1">'+x.company+' · '+x.sector+'</div><div class="text-sm text-slate-400 mt-2">'+x.problem+'</div></article>').join('')||'<div class="text-slate-500">Aucun diagnostic.</div>'})();</script></body></html>
