services:
  api:
    build: .
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      DATABASE_URL: postgresql://unx4:unx4@postgres:5432/unx4
      REDIS_URL: redis://redis:6379/0
      CKAN_BASE_URL: https://www.donneesquebec.ca/recherche/api/3/action
    depends_on:
      sync:
    build: .
    command: ["python","-m","app.scheduler"]
    environment:
      DATABASE_URL: postgresql://unx4:unx4@postgres:5432/unx4
      REDIS_URL: redis://redis:6379/0
      CKAN_BASE_URL: https://www.donneesquebec.ca/recherche/api/3/action
      UNX4_SYNC_INTERVAL_SECONDS: 21600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: unx4
      POSTGRES_USER: unx4
      POSTGRES_PASSWORD: unx4
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U unx4 -d unx4"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
