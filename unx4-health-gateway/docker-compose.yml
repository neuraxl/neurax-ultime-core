services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://unx4:unx4@postgres:5432/unx4
      REDIS_URL: redis://redis:6379/0
      CKAN_BASE_URL: https://www.donneesquebec.ca/recherche/api/3/action
    depends_on: [postgres, redis]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: unx4
      POSTGRES_USER: unx4
      POSTGRES_PASSWORD: unx4
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
